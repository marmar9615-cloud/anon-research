<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" role="img" aria-label="Demo terminal session of the anon-research skill">
  <defs>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3b40"/>
      <stop offset="100%" stop-color="#2a2b30"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- window with shadow -->
  <g filter="url(#shadow)">
    <rect x="6" y="4" width="808" height="500" rx="10" ry="10" fill="#1d1f23"/>
    <!-- title bar (rounded only on top) -->
    <path d="M 16 4 L 804 4 Q 814 4 814 14 L 814 34 L 6 34 L 6 14 Q 6 4 16 4 Z" fill="url(#titleBar)"/>
    <line x1="6" y1="34" x2="814" y2="34" stroke="#000" stroke-opacity="0.4" stroke-width="0.5"/>
  </g>

  <!-- traffic lights -->
  <circle cx="24" cy="19" r="6.5" fill="#ff5f57" stroke="#e0443c" stroke-width="0.5"/>
  <circle cx="44" cy="19" r="6.5" fill="#febc2e" stroke="#dba01b" stroke-width="0.5"/>
  <circle cx="64" cy="19" r="6.5" fill="#28c840" stroke="#1ba728" stroke-width="0.5"/>

  <!-- title -->
  <text x="410" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="12" font-weight="500" fill="#c2c2c8" text-anchor="middle">anon-research — bash — 100x30</text>

  <!-- terminal content -->
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">

    <!-- prompt + command 1: status -->
    <text x="20" y="60">
      <tspan fill="#7ee787">~/.claude/skills/anon-research</tspan><tspan fill="#888"> ❯ </tspan><tspan fill="#d2a8ff">scripts/anon.py</tspan><tspan fill="#c9d1d9"> status</tspan>
    </text>

    <text x="20" y="82" fill="#c9d1d9">Two requests with different SOCKS auth (→ different circuits):</text>
    <text x="20" y="101" fill="#c9d1d9">  request 1: IP=<tspan fill="#79c0ff">37.114.50.27</tspan>   IsTor=<tspan fill="#7ee787">True</tspan></text>
    <text x="20" y="120" fill="#c9d1d9">  request 2: IP=<tspan fill="#79c0ff">192.42.116.52</tspan>  IsTor=<tspan fill="#7ee787">True</tspan></text>
    <text x="20" y="139" fill="#7ee787" font-weight="600">OK: Tor working with per-request circuit isolation.</text>

    <!-- prompt + command 2: search -->
    <text x="20" y="178">
      <tspan fill="#7ee787">~/.claude/skills/anon-research</tspan><tspan fill="#888"> ❯ </tspan><tspan fill="#d2a8ff">scripts/anon.py</tspan><tspan fill="#c9d1d9"> search </tspan><tspan fill="#a5d6ff">"tor anonymity research"</tspan>
    </text>

    <text x="20" y="200">
      <tspan fill="#ffa657">1. </tspan><tspan fill="#c9d1d9">Tor Project | Research</tspan>
    </text>
    <text x="20" y="219" fill="#79c0ff">   https://research.torproject.org/</text>

    <text x="20" y="242">
      <tspan fill="#ffa657">2. </tspan><tspan fill="#c9d1d9">Tor network anonymity evaluation based on node anonymity</tspan>
    </text>
    <text x="20" y="261" fill="#79c0ff">   https://link.springer.com/article/10.1186/s42400-023-00191-8</text>

    <!-- prompt + command 3: blocked -->
    <text x="20" y="300">
      <tspan fill="#7ee787">~/.claude/skills/anon-research</tspan><tspan fill="#888"> ❯ </tspan><tspan fill="#d2a8ff">scripts/anon.py</tspan><tspan fill="#c9d1d9"> fetch </tspan><tspan fill="#a5d6ff">'https://google.com/search?q=test'</tspan>
    </text>
    <text x="20" y="322" fill="#ff7b72" font-weight="600">BLOCKED: HTTP 429</text>
    <text x="20" y="341" fill="#c9d1d9">  fail-closed — never falls back to clearnet.</text>

    <!-- prompt + command 4: success fetch -->
    <text x="20" y="380">
      <tspan fill="#7ee787">~/.claude/skills/anon-research</tspan><tspan fill="#888"> ❯ </tspan><tspan fill="#d2a8ff">scripts/anon.py</tspan><tspan fill="#c9d1d9"> fetch </tspan><tspan fill="#a5d6ff">https://check.torproject.org</tspan>
    </text>
    <text x="20" y="402" fill="#7ee787" font-weight="600"># Congratulations. This browser is configured to use Tor.</text>
    <text x="20" y="421" fill="#c9d1d9">You are now free to browse the Internet anonymously.</text>

    <!-- live cursor -->
    <text x="20" y="460">
      <tspan fill="#7ee787">~/.claude/skills/anon-research</tspan><tspan fill="#888"> ❯ </tspan><tspan fill="#c9d1d9">▌</tspan>
    </text>

  </g>

  <!-- subtle bottom hint -->
  <text x="410" y="492" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#666"
        text-anchor="middle" font-style="italic">every request → fresh Tor circuit → unlinkable to the previous one</text>
</svg>
